    behavior: Reads top-level content/blog MDX files, orders known high-impression slugs first, and links each card to /article/{slug}.
    limitations: The listing scan is not recursive and its hard-coded impression order can become stale.
  - id: article-detail
    source: app/(public)/article/[slug]/page.tsx and article-utils.ts
    behavior: Recursively scans content/blog, loads the requested MDX file, renders metadata and body content, and supplies previous/next navigation through ArticleNavigation.
    limitations: Seven blocked slugs are excluded by article-utils; frontmatter slug is not the routing source.
  - id: sitemap
    source: app/sitemap.ts
    behavior: Recursively scans content/blog and emits /article/{slug} entries after excluding BLOG_GONE_SLUGS.
    limitations: lastModified falls back to 2026-01-01 when an article date is absent.
  - id: navigation
    source: app/components/Navbar.tsx, app/components/Footer.tsx, and app/data/nav-links.ts
    behavior: Navbar and footer expose the article index; the shared live service menu also feeds sitemap service URLs.
    limitations: No topic-cluster or pillar navigation is currently exposed in the global navigation.
  - id: recommendations
    source: app/(public)/article/[slug]/ArticleNavigation.tsx; app/(public)/article/[slug]/RecommendedSidebar.tsx; app/components/BlogPreview.tsx; app/factory/[slug]/page.tsx; data/link-graph.json
    behavior: Article detail pages expose previous/next links in the recursive filesystem order returned by article-utils. Homepage recommendations use a hard-coded TOP_SLUGS list. Factory pages use explicit link-graph relationships. The same-category RecommendedSidebar helper exists but is not mounted in the article page.
    limitations: Recommendation behavior is split across three mechanisms; previous/next order is filesystem-dependent, the dormant sidebar is not an active discovery surface, and no shared service-led topic graph exists yet.
  - id: dashboard
    source: ../productivity/growth-dashboard/ and ../productivity/daily-analytics/reports/
    behavior: Local growth-dashboard data and dated analytics exports expose article performance for internal review.
    limitations: The dashboard is outside the frontend Git repository and daily_report.py mutates data and may deploy Cloudflare Pages, so this audit reads dated exports only.
